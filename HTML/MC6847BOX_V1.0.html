<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MC6847BOX V1.0</title><style>body{background:#171717;color:#ddd;font:16px monospace;max-width:850px;margin:20px auto;padding:12px}canvas{width:100%;image-rendering:pixelated;display:block;background:black}button,input,select{font:inherit;margin:5px;padding:8px}small{display:block;margin:12px 0}</style></head><body><canvas id="screen" width="256" height="192" tabindex="0"></canvas><button id="play">Play / Stop</button><button id="prev">Previous</button><button id="next">Next</button><button id="cod">COD library</button><button id="reset">Reboot</button><label>Song length <input id="len" type="number" min="1" max="999" value="48" style="width:65px"></label><div id="entry" hidden><select id="slot"></select><input id="code" maxlength="16" placeholder="16 hex characters"><button id="store">Store</button><button id="cancel">Cancel</button></div><div id="status"></div><small>Offline interface prototype. Tap steps to edit. Space: transport; A-H: pattern; 1-8: track; Alt+C: code entry. Instrument audio and CoCo disk I/O are not implemented.</small><script>
const $=id=>document.getElementById(id),c=$('screen'),g=c.getContext('2d'),G='#00df00',B='#000';
const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789*#_:+-/.?!';const glyphs=['0E11111F111111','1E11111E11111E','0E11101010110E','1E11111111111E','1F10101E10101F','1F10101E101010','0E11101711110F','1111111F111111','0E04040404040E','0702020212120C','11121418141211','1010101010101F','111B1515111111','11191513111111','0E11111111110E','1E11111E101010','0E11111115120D','1E11111E141211','0F10100E01011E','1F040404040404','1111111111110E','11111111110A04','11111115151B11','11110A040A1111','11110A04040404','1F01020408101F','0E11131519110E','040C040404040E','0E11010204081F','1E01010E01011E','02060A121F0202','1F10101E01011E','0E10101E11110E','1F010204080808','0E11110E11110E','0E11110F01010E','00150E1F0E1500','0A0A1F0A1F0A0A','0000000000001F','00040400040400','0004041F040400','0000001F000000','01010204081010','00000000000404','0E110102040004','04040404040004'];const font=Object.fromEntries([...chars].map((ch,i)=>[ch,glyphs[i].match(/../g).map(x=>parseInt(x,16))]));
const names=['1KICK','2SNAR','3HAT','4COD','5SIN','6SAW','7SQR','8NOZ'],lib=['CLAP','RIM','COWBELL','TOM','ZAP','LASER','METAL','CRASH','GLITCH'],demo=['9000900090007777','0000902000007777','6253625362537777','0030005000407777','8070806080708060','0040005000300070','7000500080006000','0003000000050009'];let codes=Array(9).fill(''),bank,arr,pos,step,bpm,playing,selected,pat,muted,tick,titleTick,mode,msg,slot=0,elapsed=0,ac;const help='SPACE: PLAY/STOP   A-H: PATTERN   1-8: TRACK   ALT+C: COD   S: SAVE   L: LOAD    ';
function reset(){bank=Array.from({length:8},(_,p)=>demo.map((r,i)=>[...r].map((v,s)=>p===3?+v:(+v===0?0:((+v+p+i+s)%9)+1))));arr=Array.from({length:999},(_,i)=>i<48?('AAABAAABCCCDCCCDAAABAAABCCCDCCCCDEEFCCCDGGGDGGGH'[i]||'A'):'0');pos=32;step=0;bpm=120;playing=false;selected=0;pat=3;muted=Array(8).fill(false);tick=titleTick=elapsed=0;mode='';msg=help;$('entry').hidden=true;draw()}
function rect(x,y,w,h,color=G){g.fillStyle=color;g.fillRect(x,y,w,h)}function text(s,x,y,inv=false){[...s].forEach((ch,i)=>{if(inv)rect(x+i*8,y,8,12);g.fillStyle=inv?B:G;(font[ch]||[]).forEach((v,j)=>{for(let k=0;k<5;k++)if(v&(16>>k))g.fillRect(x+i*8+k+1,y+j+2,1,1)})})}function scroll(s,n,o){return Array.from({length:n},(_,i)=>s[(o+i)%s.length]).join('')}
function draw(){rect(0,0,256,192,B);rect(0,0,256,12);rect(0,0,40,12,playing?'#ed2020':G);rect(40,0,8,12,B);rect(176,0,8,12,B);text('MC6847BOX V1.0',48,0,true);text('DAV 2027',192,0,true);text('SAVE: ________',0,12);text('LOAD: DEMO1___',0,24);text('SONG:',136,12);rect(184,12,72,24);text(scroll('DEMO1    ',9,titleTick),184,12,true);text('#'+String(pos+1).padStart(3,'0'),216,24,true);[...'ABCDEFGH'].forEach((v,i)=>text(v,8+i%4*8,48+Math.floor(i/4)*12,i===pat));text('PLAY',64,48,playing);text('STOP',64,60,!playing);text('BPM',128,48);text('+'+String(bpm).padStart(3,'0')+'-',120,60);rect(48,72,128,12);for(let s=0;s<16;s++){let v=({0:'1',4:'5',8:'9',12:'1',13:'3'})[s]||' ';if(s===step){rect(48+s*8,72,8,12,B);text(v,48+s*8,72)}else text(v,48+s*8,72,true)}names.forEach((n,r)=>{text(n.padEnd(5),0,84+r*12,playing?!muted[r]:selected===r);bank[pat][r].forEach((v,s)=>text(v?String(v):'*',48+s*8,84+r*12,!!v))});rect(184,36,24,144);rect(248,36,8,144);let base=Math.floor(pos/48)*48;for(let r=0;r<12;r++){if(base+r*4<999)text(String(base+r*4+1).padStart(3),184,36+r*12,true);for(let s=0;s<4;s++){let i=base+r*4+s;if(i<999)text(arr[i],216+s*8,36+r*12,i===pos)}}let line=mode==='cod'?'COD#'+(slot+1)+': '+$('code').value.toUpperCase()+'_':mode==='notice'?msg:playing?'PLAYING #'+String(pos+1).padStart(3,'0')+' PAT '+ 'ABCDEFGH'[pat]+' STEP '+String(step+1).padStart(2,'0')+'/16':scroll(help,32,tick);text(line.slice(0,32),0,180);$('status').textContent='Position '+(pos+1)+' / 999 · Pattern '+ 'ABCDEFGH'[pat]+' · '+(playing?'Playing':'Edit mode')}
function click(){if(playing)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();let o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=950;v.gain.value=.035;o.connect(v);v.connect(ac.destination);o.start();o.stop(ac.currentTime+.027)}catch(e){}}function go(n){pos=(n+999)%999;step=0;pat=Math.max(0,'ABCDEFGH'.indexOf(arr[pos]));draw()}function toggle(){if(!playing)click();playing=!playing;titleTick=elapsed=0;draw()}function notice(s){mode='notice';msg=s;draw();setTimeout(()=>{if(mode==='notice'){mode='';draw()}},2200)}function cod(){if(playing)return;click();mode='cod';$('entry').hidden=false;$('code').value=codes[slot];draw()}
lib.forEach((n,i)=>{let o=document.createElement('option');o.value=i;o.textContent=(i+1)+' '+n;$('slot').appendChild(o)});$('slot').onchange=()=>{slot=+$('slot').value;$('code').value=codes[slot];click();draw()};$('code').oninput=()=>{click();draw()};$('store').onclick=()=>{let v=$('code').value.toUpperCase();if(!/^[0-9A-F]{16}$/.test(v)){$('status').textContent='Enter 16 hexadecimal characters.';return}codes[slot]=v;$('entry').hidden=true;notice('COD '+(slot+1)+' STORED IN SESSION');click()};$('cancel').onclick=()=>{$('entry').hidden=true;mode='';draw()};$('cod').onclick=cod;$('play').onclick=toggle;$('prev').onclick=()=>{click();go(pos-1)};$('next').onclick=()=>{click();go(pos+1)};$('reset').onclick=reset;
c.onclick=e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*256/r.width,y=(e.clientY-r.top)*192/r.height;if(y>=48&&y<72&&x>=64&&x<96){if((y<60)!==playing)toggle();return}if(y>=60&&y<72&&x>=120&&x<160){if(x<128)bpm=Math.min(300,bpm+1);else if(x>=152)bpm=Math.max(30,bpm-1)}else if(y>=84&&y<180&&x<40){let i=Math.floor((y-84)/12);if(playing)muted[i]=!muted[i];else selected=i}else if(!playing&&y>=84&&y<180&&x>=48&&x<176){let i=Math.floor((y-84)/12),s=Math.floor((x-48)/8);selected=i;bank[pat][i][s]=(bank[pat][i][s]+1)%10}else if(!playing&&x>=8&&x<40&&y>=48&&y<72){pat=Math.floor((y-48)/12)*4+Math.floor((x-8)/8);arr[pos]='ABCDEFGH'[pat]}else if(x>=216&&x<248&&y>=36&&y<180){go(Math.min(998,Math.floor(pos/48)*48+Math.floor((y-36)/12)*4+Math.floor((x-216)/8)))}else if(y>=180&&!playing){cod();return}else return;click();draw()};c.onkeydown=e=>{let k=e.key.toUpperCase();if(k===' '){e.preventDefault();toggle();return}if(k==='C'&&e.altKey){cod();return}if(!playing&&/^[A-H]$/.test(k)){pat='ABCDEFGH'.indexOf(k);arr[pos]=k}else if(/^[1-8]$/.test(k)){if(playing)muted[+k-1]=!muted[+k-1];else selected=+k-1}else if(k==='ARROWRIGHT')go(pos+1);else if(k==='ARROWLEFT')go(pos-1);else if(k==='S'||k==='L'){notice('DISK I/O NOT IMPLEMENTED');return}else return;e.preventDefault();click();draw()};let last=performance.now();setInterval(()=>{let now=performance.now(),dt=now-last;last=now;if(playing){elapsed+=dt;while(elapsed>=15000/bpm){elapsed-=15000/bpm;step=(step+1)%16;if(step%4===0)titleTick++;if(!step){pos=(pos+1)%Math.max(1,Math.min(999,Math.floor(+$('len').value)||48));pat=Math.max(0,'ABCDEFGH'.indexOf(arr[pos]))}}draw()}},20);setInterval(()=>{tick++;if(!playing)draw()},220);reset();
</script></body></html>
